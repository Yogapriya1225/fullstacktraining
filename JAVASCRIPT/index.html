       function student(name)

        return "Hello this is a arrow funtion";

       }

         //promise
         //resolve, reject fulfilled
         let fetch_api = new Promise((resolve, reject) => {
            let api = true;
            if(api){
                resolve("Data is fetched successfully");
            }else{
                reject("Data is not fetched");
            }
         })
         fetch_api.then((data) => console.log(data));

 let order = new Promise((resolve, reject) => {
            let api = true;
            if(api){
                setTimeout(() => {
                    resolve("Order is placed successfully");
                }, 2000);
                //resolve("Order is placed successfully");
            }else{
                setTimeout(() => {
                    reject("Order is not placed");
                }, 2000);

            }
         })
